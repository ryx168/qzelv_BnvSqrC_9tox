name: Edit session

# On-demand WordPress. Nothing persistent runs anywhere: the database and
# wp-content live in R2, are restored into this runner for the length of one
# editing session, and are written back continuously.
#
#   start  -> restore state from R2, boot WordPress, open a Cloudflare tunnel
#   during -> autosave to R2 every 5 minutes (a dead runner loses <= 5 min)
#   end    -> save, export the site to static HTML, commit, deploy
#
# The session ends on whichever comes first: no activity for idle_minutes, or
# the timeout below (a GitHub job cannot run beyond 6 hours).

on:
  workflow_dispatch:
    inputs:
      idle_minutes:
        description: "Stop after this many minutes with no activity"
        default: "60"
      publish:
        description: "Publish to the live site when the session ends"
        type: boolean
        default: true
      tunnel:
        description: "Open the editor tunnel. Off = dry run: boot and export only, nothing exposed"
        type: boolean
        default: true
      export_only:
        description: "Export and upload the result for inspection, but do not commit or publish"
        type: boolean
        default: false

concurrency:
  # Never two sessions at once -- the second would overwrite the first's work.
  group: wp-edit-session
  cancel-in-progress: false

# The session commits the exported site back here. The default token is
# read-only on a public repository, which fails the push with a bare 403.
permissions:
  contents: write

env:
  EDIT_HOST: ${{ secrets.EDIT_HOSTNAME }}
  LIVE_HOST: ${{ secrets.SITE_HOST }}
  STATE_BUCKET: ${{ secrets.STATE_BUCKET }}
  WP_DIR: /opt/wp

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 350          # under the 360 ceiling, so the save step still runs
    steps:
      - uses: actions/checkout@v5

      - name: Restore WordPress state from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ENDPOINT: https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          aws s3 cp "s3://$STATE_BUCKET/db-latest.sql.gz"   /tmp/db.sql.gz         --endpoint-url "$ENDPOINT" --no-progress
          aws s3 cp "s3://$STATE_BUCKET/wp-content.tar.gz"  /tmp/wp-content.tar.gz --endpoint-url "$ENDPOINT" --no-progress
          ls -l /tmp/db.sql.gz /tmp/wp-content.tar.gz

      - name: Boot WordPress
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: sudo -E bash tools/wp-boot.sh

      - name: Open tunnel
        if: inputs.tunnel
        env:
          TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
        run: |
          set -euo pipefail
          sudo curl -fsSL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared
          nohup cloudflared tunnel --no-autoupdate run --token "$TUNNEL_TOKEN" \
            > /tmp/cloudflared.log 2>&1 &
          for _ in $(seq 1 30); do
            grep -q "Registered tunnel connection" /tmp/cloudflared.log && break
            sleep 2
          done
          grep -q "Registered tunnel connection" /tmp/cloudflared.log \
            || { echo "tunnel did not come up"; tail -20 /tmp/cloudflared.log; exit 1; }
          echo "::notice title=Editor ready::https://${EDIT_HOST}/wp-admin/"

      - name: Hold the session open, autosaving
        id: hold
        if: inputs.tunnel
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ENDPOINT: https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com
          IDLE_MINUTES: ${{ inputs.idle_minutes }}
        run: sudo -E bash tools/wp-session.sh

      # always() so a cancelled or failed session still writes its work back.
      - name: Save state and export the site
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ENDPOINT: https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com
          # Only export when the editor actually opened: if the tunnel never
          # came up the hold step is skipped, nobody could have edited
          # anything, and re-publishing an unchanged site is risk with no gain.
          PUBLISH: ${{ inputs.publish && steps.hold.outcome != 'skipped' }}
          EXPORT_ONLY: ${{ inputs.export_only }}
        run: sudo -E bash tools/wp-save.sh

      - name: Upload the export for inspection
        if: always() && inputs.export_only
        run: sudo chown -R "$(id -u):$(id -g)" /tmp/mirror || true

      - uses: actions/upload-artifact@v4
        if: always() && inputs.export_only
        with:
          name: exported-site
          path: /tmp/mirror
          if-no-files-found: warn

      - name: Commit the exported site
        if: always() && inputs.publish && !inputs.export_only && steps.hold.outcome != 'skipped'
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" .
          # The database is NEVER committed: this repo is public and wp_users
          # holds password hashes and email addresses. .gitignore blocks the
          # patterns; this is the second line of defence.
          git add -A
          git reset -q -- '*.sql' '*.sql.gz' '*.tar.gz' 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no content changes"
            exit 0
          fi
          git -c user.name="edit-session" \
              -c user.email="noreply@users.noreply.github.com" \
              commit -m "Site edit $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin main
