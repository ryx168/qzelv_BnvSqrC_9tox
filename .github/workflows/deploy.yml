name: Deploy static site

# Every push to main redeploys (live in well under a minute).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Sync site to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ENDPOINT: https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          # --delete keeps the bucket an exact mirror of the repo, so removing a
          # page here removes it from the live site. This is exactly why the
          # editor state lives in a SEPARATE bucket -- it would be wiped.
          aws s3 sync . "s3://${{ secrets.SITE_BUCKET }}" \
            --endpoint-url "$ENDPOINT" \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "tools/*" \
            --exclude "README.md" \
            --no-progress

      - name: Verify site responds
        run: |
          set -euo pipefail
          sleep 5
          for path in "/" "/contact/" "/the-space/"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ secrets.SITE_HOST }}${path}")
            echo "${path} -> ${code}"
            [ "$code" = "200" ] || { echo "FAILED: ${path} -> ${code}"; exit 1; }
          done
